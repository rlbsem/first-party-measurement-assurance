name: Verify BigQuery readiness offline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bigquery-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adapter-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      DBT_TARGET_PATH: .local/bigquery-parse/target
      DBT_LOG_PATH: .local/bigquery-parse/logs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-bigquery.lock
      - run: python -m pip install -r requirements-bigquery.lock
      - run: python -m pip check
      - name: Offline safety, admission and complete rowset contracts
        run: python -m pytest -q tests/test_bigquery_acceptance.py tests/test_ga4_contract.py
      - name: Parse the actual pinned BigQuery adapter without connecting
        run: python -m dbt.cli.main parse --project-dir ga4_pipeline --profiles-dir ga4_pipeline --target bigquery --no-partial-parse
      - name: Verify exact public package inventory
        run: python scripts/package.py --check
