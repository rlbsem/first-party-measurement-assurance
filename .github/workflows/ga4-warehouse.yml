name: Verify GA4 warehouse modeling
on:
  push:
    paths:
      - 'ga4_pipeline/**'
      - 'scripts/verify_ga4_pipeline.py'
      - 'tests/test_ga4_contract.py'
      - 'tests/test_ga4_regression_guard.py'
      - 'tests/test_warehouse_preview*'
      - 'scripts/warehouse_preview.py'
      - 'scripts/check_warehouse_preview_evidence.py'
      - 'bigquery/warehouse_*.sql'
      - 'docs/evidence/warehouse-review/**'
      - 'docs/ga4-warehouse.md'
      - '.github/workflows/ga4-warehouse.yml'
  pull_request:
    paths:
      - 'ga4_pipeline/**'
      - 'scripts/verify_ga4_pipeline.py'
      - 'tests/test_ga4_contract.py'
      - 'tests/test_ga4_regression_guard.py'
      - 'tests/test_warehouse_preview*'
      - 'scripts/warehouse_preview.py'
      - 'scripts/check_warehouse_preview_evidence.py'
      - 'bigquery/warehouse_*.sql'
      - 'docs/evidence/warehouse-review/**'
      - 'docs/ga4-warehouse.md'
      - '.github/workflows/ga4-warehouse.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ga4-warehouse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-ga4:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Independent source contract checks
        run: python -m pytest -q tests/test_ga4_contract.py tests/test_ga4_regression_guard.py tests/test_warehouse_preview.py tests/test_warehouse_preview_evidence.py
      - name: Check recorded native SQL and preserved historical evidence
        run: python scripts/check_warehouse_preview_evidence.py
      - name: Preserve original source and execution records
        run: python scripts/check_warehouse_preservation.py
      - name: Incremental, replay and full-refresh acceptance
        run: python scripts/verify_ga4_pipeline.py --output .local/ga4-run.json
      - name: Preserve synthetic local execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ga4-local-${{ matrix.os }}
          path: |
            .local/ga4-run.json
            .local/ga4-verification-*/dbt.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
