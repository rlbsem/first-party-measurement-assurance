name: Verify governed streaming
on:
  pull_request:
  push:
    branches: [feat/gcp-streaming-control-plane, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: streaming-${{ github.ref }}
  cancel-in-progress: true
jobs:
  beam-and-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-streaming.lock
      - run: python -m pip install -r requirements-streaming.lock
      - run: python -m pytest streaming_tests -q --basetemp=.local/streaming-pytest --junitxml=.local/streaming-tests.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: streaming-${{ matrix.os }}
          path: .local/streaming-tests.xml
          include-hidden-files: true
          retention-days: 7
